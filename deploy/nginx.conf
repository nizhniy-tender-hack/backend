# Reverse-proxy для ked-ai.site: /backend/api/v1 -> backend (127.0.0.1:8000/api/v1),
# /ml зарезервирован под ML-сервис, корень — статика фронтенда
# (см. README «Деплой на прод»).
#
# Установка на сервере:
#   cp deploy/nginx.conf /etc/nginx/sites-available/ked-ai.site
#   ln -s /etc/nginx/sites-available/ked-ai.site /etc/nginx/sites-enabled/ked-ai.site
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d ked-ai.site   # добавит TLS-блок и редирект с 80 на 443 автоматически
#
# Фронтенд (репозиторий assistant-ui-agent-front):
#   npm run build && scp -r dist/ ked-ai:/opt/frontend/dist

server {
    listen 80;
    listen [::]:80;
    server_name ked-ai.site;

    root /opt/frontend/dist;
    index index.html;

    # Backend API: /backend/api/v1/... -> 127.0.0.1:8000/api/v1/...
    location /backend/api/v1/ {
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ML-сервис ещё не развёрнут: заглушка вместо proxy_pass в никуда.
    # Когда сервис поднимется, заменить весь блок на вариант ниже — он отдаёт
    # чат агента потоком (SSE). Без отключённой буферизации nginx копит ответ
    # целиком и стриминг на фронте не работает.
    #
    #   location /ml/ {
    #       proxy_pass http://127.0.0.1:<ML_PORT>/;
    #       proxy_set_header Host $host;
    #       proxy_set_header X-Real-IP $remote_addr;
    #       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #       proxy_set_header X-Forwarded-Proto $scheme;
    #
    #       proxy_http_version 1.1;
    #       proxy_set_header Connection "";
    #       proxy_buffering off;
    #       proxy_cache off;
    #       proxy_read_timeout 1h;
    #   }
    location /ml {
        default_type application/json;
        return 503 '{"detail":"ML service is not deployed yet"}';
    }

    # Фронтенд: собранная статика, SPA-fallback на index.html.
    location / {
        try_files $uri $uri/ /index.html;

        # Файлы сборки содержат хеш в имени — можно кешировать надолго.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # index.html кешировать нельзя: иначе после деплоя отдаются старые ссылки.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
    }
}
